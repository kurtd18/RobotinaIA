name: Crypto Alerts

on:
  workflow_dispatch: {}
  schedule:
    # Una vez al día - la estrategia ahora mira velas DIARIAS (flip de
    # color + RSI/Estocástico/Williams%R), corre poco después de la
    # medianoche UTC cuando Binance ya cerró la vela del día. Correr
    # más seguido no aporta nada: la vela de hoy no cambia hasta mañana.
    - cron: '15 0 * * *'   # ~7:15 PM Colombia (día anterior)

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RobotinaIA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto-alerts/analyze_and_notify.py
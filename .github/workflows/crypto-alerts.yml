name: Crypto Alerts

on:
  workflow_dispatch: {}
  schedule:
    # Cada 4h, por pedido explícito. La regla lee la vela DIARIA, así
    # que fuera de la corrida de las 02:15 UTC (justo después del cierre
    # de la vela de Binance a medianoche) las demás corridas evalúan la
    # vela de hoy todavía en formación, no un dato cerrado - trade-off
    # conocido y aceptado a cambio de notificaciones más frecuentes.
    - cron: '15 2 * * *'
    - cron: '15 6 * * *'
    - cron: '15 10 * * *'
    - cron: '15 14 * * *'
    - cron: '15 18 * * *'
    - cron: '15 22 * * *'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RobotinaIA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto-alerts/analyze_and_notify.py